<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Для Надин</title>
<style>
:root{--bg:#0c0f1a;--ink:#f3efe6;--muted:#a8a6b3;--gold:#f2b84b;--rose:#ff7a8a;--line:rgba(243,239,230,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100svh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#1d2240,var(--bg) 60%);
 color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}
.card{width:100%;max-width:380px;text-align:center}
.gift{font-size:3.4rem;margin-bottom:14px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
h1{font-size:1.5rem;font-weight:600;margin-bottom:8px}
p{color:var(--muted);margin-bottom:26px;font-size:.98rem}
input{width:100%;padding:15px 18px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);
 color:var(--ink);font-size:1.1rem;text-align:center;letter-spacing:.12em;outline:none}
input:focus{border-color:var(--gold)}
button{margin-top:12px;width:100%;padding:15px;border:0;border-radius:14px;font-size:1rem;font-weight:600;cursor:pointer;
 background:linear-gradient(120deg,var(--gold),var(--rose));color:#1b1408}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--rose);min-height:1.4em;margin-top:12px;font-size:.92rem}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style>
</head>
<body>
<div class="card" id="f">
  <div class="gift">🎁</div>
  <h1>Надин, это для тебя</h1>
  <p>Подарок открывается особой датой — днём, когда тебе исполнилось 18.</p>
  <input id="pw" type="text" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="ДД ММ ГГГГ" aria-label="Пароль">
  <button id="go" type="button">Открыть</button>
  <div class="err" id="err"></div>
</div>

function b64(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u}
async function nativeDecrypt(pass,salt,iv,ct){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct));
}
async function decrypt(pass){
  var p=PAYLOAD.split('.'),salt=b64(p[0]),iv=b64(p[1]),ct=b64(p[2]);
  if(window.crypto&&crypto.subtle){
    try{return await nativeDecrypt(pass,salt,iv,ct)}
    catch(e){if(e&&e.name==='OperationError')throw e} /* wrong password */
  }
  await new Promise(function(r){setTimeout(r,30)});
  return window.__fallbackDecrypt(pass,salt,iv,ct,ITER);
}
function show(html){
  try{document.open();document.write(html);document.close();return}catch(e){}
  var doc=new DOMParser().parseFromString(html,'text/html');
  document.documentElement.replaceWith(doc.documentElement);
  document.querySelectorAll('script').forEach(function(old){var s=document.createElement('script');s.textContent=old.textContent;old.replaceWith(s)});
}
var f=document.getElementById('f'),pw=document.getElementById('pw'),go=document.getElementById('go'),err=document.getElementById('err'),busy=false;
async function open_(){
  if(busy)return;
  var pass=pw.value.replace(/\D/g,'');
  if(!pass){err.textContent='Введи дату цифрами';return}
  busy=true;go.disabled=true;go.textContent='Открываю…';err.textContent='';
  try{ show(await decrypt(pass)); }
  catch(e){
    busy=false;go.disabled=false;go.textContent='Открыть';err.textContent='Не та дата — попробуй ещё раз';
    f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');
  }
}
go.addEventListener('click',open_);
